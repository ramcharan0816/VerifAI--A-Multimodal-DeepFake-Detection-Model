services:
  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8000"
      VERIFAI_DB_PATH: /data/verifai_history.db
      VERIFAI_FRONTEND_ORIGINS: ${VERIFAI_FRONTEND_ORIGINS:-https://verifai-a-multimodal-deepfake-detec.vercel.app}
      HF_HOME: /data/huggingface
    expose:
      - "8000"
    volumes:
      - verifai_data:/data
      - verifai_uploads:/app/backend/uploads
      - ./backend/weights:/app/backend/weights:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  verifai_data:
  verifai_uploads:
  caddy_data:
  caddy_config:
